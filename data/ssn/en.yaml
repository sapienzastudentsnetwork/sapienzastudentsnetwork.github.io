SSN_Coordinator: Coordinator
SSN_Coordinator_Description: >-
  <strong>Matteo Collica</strong> created Sapienza Students Network in 2021 and has been one of
  its main contributors ever since, designing and coordinating many of the projects that exist
  today. The Coordinator also supports the organization's overall coordination and alignment
  across projects, communities and initiatives, working collaboratively with the Executive Board.
SSN_Executive_Board: Executive Board
SSN_Executive_Board_Contact: >-
  The Executive Board is the team that exclusively reads and replies to messages sent through the
  <a href="https://telegram.me/SapienzaStudentsNetworkBot">official contact bot</a>.
SSN_Forums: Forums
SSN_Forums_Description: >-
  The GitHub Exercise and Solution Forums are open spaces for comparing solutions to exercises and
  past exams, accompanied by learning resources maintained by the community. <strong>Valerio
  Fontana</strong> is the Delegate for the management of the GitHub organization's Forums and the
  contact person for anyone interested in helping manage an existing forum or proposing, launching
  and managing a new one.
SSN_Forums_Open: Explore the Forums →
SSN_Groups: Groups
SSN_Groups_Description: >-
  Telegram communities connect students across programmes and courses; SapienzaStudentsBot helps
  people discover and reach the available groups. To ensure organizational continuity,
  <strong>Matteo Collica</strong> owns more than 140 groups concerning degree programmes in the
  Department of Computer Science and Sapienza more broadly, and is the main contact for the
  Telegram communities managed by Sapienza Students Network.
