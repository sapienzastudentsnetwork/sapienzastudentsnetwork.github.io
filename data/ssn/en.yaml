SSN_Activities_Text: '<p><strong>Sapienza Students Network brings together people, knowledge and technology to make university life easier</strong></p>

  <ul>

  <li><strong>Communities and guidance:</strong> it creates and coordinates groups and discussion spaces, helping prospective and current students find people, information and peer support;</li>

  <li><strong>Information and resources:</strong> it maintains wikis, guides, timetables and curated resources for navigating courses, services and opportunities at Sapienza;</li>

  <li><strong>Open source and learning collaboration:</strong> it develops open projects and manages forums for exercises, projects and past exams, encouraging comparison of solutions and responsible sharing of materials;</li>

  <li><strong>Digital services:</strong> it builds tools that improve accessibility, navigation and access to information;</li>

  <li><strong>Participation:</strong> it welcomes proposals, contributions and new maintainers, giving students a practical space to turn useful ideas into shared community projects</li>

  </ul>'
