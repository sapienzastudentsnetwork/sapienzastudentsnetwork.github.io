SSN_Activities_Text: '<p><strong>Sapienza Students Network unisce persone, conoscenze e tecnologia per rendere più semplice la vita universitaria</strong></p>

  <ul>

  <li><strong>Community e orientamento:</strong> crea e coordina gruppi e spazi di confronto, aiutando matricole e studenti a trovare persone, informazioni e supporto tra pari;</li>

  <li><strong>Informazione e risorse:</strong> cura wiki, guide, orari e raccolte di risorse utili per orientarsi tra corsi, servizi e opportunità della Sapienza;</li>

  <li><strong>Open source e collaborazione didattica:</strong> sviluppa progetti aperti e gestisce forum dedicati a esercizi, progetti e prove d''esame, favorendo il confronto sulle soluzioni e la condivisione responsabile del materiale;</li>

  <li><strong>Servizi digitali:</strong> realizza strumenti per migliorare accessibilità, navigazione e reperimento delle informazioni;</li>

  <li><strong>Partecipazione:</strong> accoglie proposte, contributi e nuovi maintainer, offrendo uno spazio concreto in cui trasformare idee utili alla comunità in progetti condivisi</li>

  </ul>'
SSN_Activities_Title: Di cosa ci occupiamo
