SSN_Coordinator: Coordinatore
SSN_Coordinator_Description: >-
  <strong>Matteo Collica</strong> ha creato Sapienza Students Network nel 2021 e da allora ne è
  uno dei principali contributori, progettando e coordinando molti dei progetti oggi esistenti.
  Favorisce inoltre il coordinamento complessivo dell’organizzazione e l’allineamento fra
  progetti, community e iniziative, operando in collaborazione con il Consiglio Direttivo.
SSN_Executive_Board: Consiglio Direttivo
SSN_Executive_Board_Contact: >-
  Il Consiglio Direttivo è il gruppo che legge e risponde in via esclusiva ai messaggi inviati
  tramite il <a href="https://telegram.me/SapienzaStudentsNetworkBot">bot ufficiale di
  contatto</a>.
SSN_Forums: Forum
SSN_Forums_Description: >-
  I Forum GitHub di Esercizi e Soluzioni sono spazi aperti per confrontare soluzioni a esercizi e
  prove d’esame, accompagnati da raccolte didattiche mantenute dalla community. <strong>Valerio
  Fontana</strong> è il Delegato per la gestione dei Forum dell’organizzazione GitHub e il
  riferimento per chi desidera contribuire alla gestione di un forum esistente oppure proporre,
  attivare e gestire un nuovo forum.
SSN_Forums_Open: Esplora i Forum →
SSN_Groups: Gruppi
SSN_Groups_Description: >-
  Le community Telegram mettono in contatto studenti di corsi e insegnamenti diversi;
  SapienzaStudentsBot aiuta a trovare e raggiungere i gruppi disponibili. Per garantire continuità
  organizzativa, <strong>Matteo Collica</strong> è owner di oltre 140 gruppi dedicati ai corsi di
  laurea del Dipartimento di Informatica e alla Sapienza più in generale, ed è il principale
  riferimento per le community Telegram gestite da Sapienza Students Network.
SSN_Groups_OpenBot: Trova i gruppi →
