<script>
    const COURSES = JSON.parse(`{{ hugo.Data.courses | jsonify (dict "noHTMLEscape" true) }}`);
    const TIMETABLES = JSON.parse(`{{ hugo.Data.timetables | jsonify (dict "noHTMLEscape" true) }}`);
    const HARDCODED_TIMETABLES = JSON.parse(`{{ hugo.Data.hardcodedTimetables | jsonify }}`)

    for (const courseId in HARDCODED_TIMETABLES) {
        if (TIMETABLES[courseId]) {
            const channelsToUpdate = HARDCODED_TIMETABLES[courseId].channels;

            // Iterate over the channels to be updated
            for (const channelId in channelsToUpdate) {
                TIMETABLES[courseId].channels[channelId] = channelsToUpdate[channelId];
            }
        } else if (HARDCODED_TIMETABLES[courseId]) {
            TIMETABLES[courseId] = HARDCODED_TIMETABLES[courseId];
        }
    }

    // Extract the classroom identifier and its location suffix.
    function getRoomData(roomString) {
        if (typeof roomString !== "string" || roomString.trim() === "") return null;

        // Match computer-room labels without treating "inf" as a prefix of "informatica".
        const computerRoomMatch = roomString.match(
            /\bAula\s+(?:informatica\b|inf\.(?=\s))\s*([A-Za-z]*\d+[A-Za-z]*)\b/i
        );

        // Match supported named rooms, Roman numerals, and alphanumeric identifiers.
        const genericRoomMatch = roomString.match(
            /\b(Zoom|Meet|XI bis|I{1,3}|IV|V{1,3}|VI|IX|X|XI|Alfa|Magna|C|G|Tullio)\b|\b[A-Za-z]*\d+[A-Za-z]*\b/
        );

        const roomNumber = computerRoomMatch?.[1] || genericRoomMatch?.[0];
        if (!roomNumber) return null;

        let prefix = "", suffix = "";
        const universityCityBuilding = roomString.match(/\bCU(\d{3})\b/i);

        if ((roomString.includes("Eudossiana")) ||
            (roomString.includes("S. Pietro in Vincoli")) ||
            (roomString.includes("RM041"))) suffix = " SPV";
        else if (universityCityBuilding?.[1] === "002") suffix = " ST"; // Scienze Statistiche
        else if (universityCityBuilding) suffix = ` ${universityCityBuilding[1]}`;
        else if (roomString.includes("RM158")) suffix = " DL";     // De Lollis
        else if (roomString.includes("RM109")) prefix = "RE ";     // Regina Elena Ed. A
        else if (roomString.includes("RM112")) suffix = " D";      // Regina Elena Ed. D
        else if (roomString.includes("RM113")) suffix = " E";      // Regina Elena Ed. E
        else if (roomString.includes("RM005")) suffix = " SC";     // Via Antonio Scarpa
        else if (roomString.includes("RM025") || /Tiburtina/i.test(roomString)) suffix = " TIB";
        else if (roomString.includes("RM018")) suffix = "L";       // Castro Laurenziano

        return { room: roomNumber, prefix, suffix };
    }

    // Group classrooms that share the same prefix and suffix to avoid repetitions (e.g., "RE 1, 2" or "15, 16 TIB")
    function formatClassrooms(roomStringsArray) {
        if (!roomStringsArray || roomStringsArray.length === 0) return null;

        const groups = {};

        // Iterate over the raw room strings to extract and group them by unique prefix + suffix combination
        for (const roomString of roomStringsArray) {
            const data = getRoomData(roomString);
            if (!data) continue;

            const prefix = data.prefix || "";
            const suffix = data.suffix || "";
            const key = `${prefix}|${suffix}`;

            if (!groups[key]) {
                groups[key] = {
                    prefix,
                    suffix,
                    rooms: []
                };
            }
            groups[key].rooms.push(data.room);
        }

        const result = [];
        for (const key in groups) {
            const group = groups[key];
            // Prepend prefix, join room numbers (e.g., "1, 2"), and append suffix
            result.push(`${group.prefix}${group.rooms.join(', ')}${group.suffix}`);
        }

        // Join different groups with a separator if they are in different buildings
        return result.length > 0 ? result.join(' - ') : null;
    }
</script>
