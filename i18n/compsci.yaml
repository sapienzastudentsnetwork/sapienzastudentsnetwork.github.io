- id: Subjs_Info_Title
  translation: About this page

- id: Subjs_Info_Tip
  translation: Click the acronym of a course name for more details about classrooms and professors

- id: Subjs_Info_Tooltip
  translation: Click for more details about classrooms and professors.

- id: Subjs_Info_Text_1
  translation: The information on this page is automatically synchronized every hour with a Sapienza API;

- id: Subjs_Info_Text_2
  translation: Sometimes the information provided by the Sapienza API – although official – may be inaccurate. Only in certain cases does our staff apply manual corrections, but it is essential to emphasize that the communications issued by professors through their official channels (Classroom, notice boards, websites, etc.) always take priority, especially for temporary changes of schedule or classroom;

- id: Subjs_Info_Text_3
  translation: You are therefore advised to make the best use of the tool provided on this page and to write to

- id: Subjs_Info_Text_4
  translation: for any questions or to report discrepancies or temporary timetable changes, in order to facilitate their manual correction on this page as well.

- id: Subjs_ThisWeekOnly
  translation: This page displays, for this week, the provisional timetable for the current week of classes. For the following weeks, timetables and/or classrooms will change; it is therefore advisable to keep up-to-date with the Degree Course "Attendance" page or the Telegram and WhatsApp groups.

- id: Subjs_Provisional
  translation: The timetables on this page are automatically synchronized with an official API, which for the moment, however, only returns partial or provisional times.

- id: Subjs_DelayedStart
  translation: "Second semester classes began on 23 February 2026, except for any courses for which otherwise indicated in notices posted on the sheet prepared by the Educational Affairs Office: "

- id: Subjs_EasterHolidays
  translation: "Teaching activities will be interrupted for the Easter period from Thursday, April 2 to Tuesday, April 7, 2026. Furthermore, lectures for the courses belonging to the Master's degree program in Computer Science will remain suspended from April 8 to April 14, 2026, to allow midterm exams to take place and to ensure classroom availability for the extraordinary exam sessions."

- id: Subjs_Referendum
  translation: "Teaching will be suspended on Monday, March 23, 2026, in order to encourage participation in the constitutional referendum."

- id: Subjs_WorkInProgress
  translation: Timetable currently being updated. Please do not rely on it for now and try again later!

- id: Subjs_NotAvailable
  translation: Timetables not yet available. Please do not rely on this page for the moment and try again in a few days!

