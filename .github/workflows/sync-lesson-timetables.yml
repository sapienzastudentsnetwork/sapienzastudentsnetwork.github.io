name: Sync lesson timetables

on:
  # Triggers this workflow on pushes to the default branch (main)
  push:
    branches: ["main"]

  # Schedule this workflow to run every 1 hour
  schedule:
    - cron: "0 */1 * * *"

  # Enables manual execution of this workflow from the Actions tab
  workflow_dispatch:

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Update package list
        run: sudo apt update

      - name: Setup Python
        uses: actions/setup-python@v4

      - name: Installing package list
        run: apt list --installed

      - name: Installing all necessary pip packages
        run: pip install bs4

      - name: Run lesson timetables sync script
        run: |
          cd _scripts
          bash ./sync-lesson-timetables.sh
        env:
          GOMPPUBLIC_GENERATEORARIO_URL: ${{ secrets.GOMPPUBLIC_GENERATEORARIO_URL }}
        working-directory: ${{ github.workspace }}

      - name: Commit changes, if any
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # Stage every path generated by the sync. CSV files live under static
          # because Hugo treats files under data as structured data sources.
          git add --all -- data static/timetables_csv_raw

          # A chmod-only working-tree change must not trigger an empty commit.
          if git diff --cached --quiet; then
            echo "No generated timetable changes to commit."
            exit 0
          fi

          if git diff --cached --quiet -- . ":(exclude)static/timetables_csv_raw/**"; then
            commit_message="Sync CSV timetables"
          else
            commit_message="Sync lesson timetables"
          fi

          git commit -m "$commit_message"
          git push
