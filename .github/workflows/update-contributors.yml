name: Update contributor rankings
on:
  push:
    branches: [main]
    paths-ignore: ['data/contributors/**']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - name: Generate rankings
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 _scripts/generate_contributors.py
      - name: Commit generated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/contributors
          git diff --cached --quiet || (git commit -m "chore: update contributor rankings" && git push)
